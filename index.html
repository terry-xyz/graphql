<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A GraphQL-powered Zone01 student profile dashboard.">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src https://platform.zone01.gr; style-src 'self'; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="stylesheet" href="src/style.css">
    <title>GraphQL Profile Dashboard</title>
</head>

<body>
    <nav id="navbar" aria-label="Profile sections">
        <button id="navbar-identity" type="button">Identity</button>
        <button id="navbar-xpLevel" type="button">XP / Level</button>
        <button id="navbar-audits" type="button">Audits</button>
    </nav>

    <h1>GraphQL Profile Dashboard</h1>

    <form id="login-form">
        <label for="login-identifier">Username or email</label>
        <input id="login-identifier" type="text" required autocomplete="username" placeholder="username or email" />
        <label for="login-password">Password</label>
        <input id="login-password" type="password" required autocomplete="current-password" placeholder="password" />
        <button id="submit-login-form-button" type="submit">Login</button>
        <p id="login-feedback" role="status" aria-live="polite"></p>
    </form>

    <section id="identity-section" hidden>
        <h2>Identity</h2>
        <p>First Name: <span id="identity-firstName"></span></p>
        <p>Last Name: <span id="identity-lastName"></span></p>
        <p>Login: <span id="identity-login"></span></p>
        <p>E-mail: <span id="identity-email"></span></p>
        <p>Campus: <span id="identity-campus"></span></p>
        <!-- Add avatar-url, labelName (cohort) and more later -->
    </section>

    <section id="xpLevel-section" hidden>
        <h2>XP / Level</h2>
        <p>Total XP: <span id="xpLevel-totalXp"></span></p>
        <p>Current/Max Level: <span id="xpLevel-currentMaxLevel"></span></p>
        <p>Biggest XP Gain: <span id="xpLevel-biggestXpGain"></span></p>

        <h3>XP Progression</h3>
        <!-- JavaScript fills this responsive SVG with cumulative XP data from xpTransactions. -->
        <svg id="xp-chart" viewBox="0 0 600 300" role="img" aria-label="XP progression over time"></svg>
    </section>

    <section id="audits-section" hidden>
        <h2>Audits</h2>

        <p>Audit Ratio: <span id="audits-ratio"></span></p>
        <p>XP Given: <span id="audits-xpGiven"></span></p>
        <p>XP Received: <span id="audits-xpReceived"></span></p>
        <p>Bonus XP: <span id="audits-bonusXp"></span></p>

        <p id="audits-warning"></p>

        <h3>XP Given vs XP Received</h3>
        <!-- JavaScript measures the labels and scales both audit bars within this 600-by-100 coordinate system. -->
        <svg id="audits-chart" viewBox="0 0 600 100" role="img"
            aria-label="Comparison of XP given and XP received"></svg>
    </section>

    <button id="logout-button" type="button">Logout</button>

    <script src="src/main.js" type="module"></script>
</body>

</html>
