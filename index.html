<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>GraphQl</title>
</head>

<body>
    <nav id="navbar">
        <button id="navbar-identity">Identity</button>
        <button id="navbar-xpLevel">XP / Level</button>
        <button id="navbar-audits">Audits</button>
    </nav>

    <h1>GraphQl</h1>

    <form id="login-form">
        <input id="login-identifier" type="text" required placeholder="username or email" />
        <input id="login-password" type="password" required placeholder="password" />
        <button id="submit-login-form-button" type="submit">LOG-IN</button>
        <div id="login-feedback"></div>
    </form>

    <section id="identity-section" hidden>
        <h2>Identity</h2>
        <p>First Name: <span id="identity-firstName"></span></p>
        <p>Last Name: <span id="identity-lastName"></span></p>
        <p>Login: <span id="identity-login"></span></p>
        <p>E-mail: <span id="identity-email"></span></p>
        <p>Campus: <span id="identity-campus"></span></p>
        <!-- Add avatar-url, labelName (cohort) and more later -->
    </section>

    <section id="xpLevel-section" hidden>
        <h2>XP / Level</h2>
        <p>Total XP: <span id="xpLevel-totalXp"></span></p>
        <p>Current/Max Level: <span id="xpLevel-currentMaxLevel"></span></p>
        <p>Biggest XP Gain: <span id="xpLevel-biggestXpGain"></span></p>

        <h3>XP Progression</h3>
        <!-- JavaScript fills this responsive SVG with cumulative XP data from xpTransactions. -->
        <svg id="xp-chart" viewBox="0 0 600 300" role="img" aria-label="XP progression over time"></svg>
    </section>

    <section id="audits-section" hidden>
        <h2>Audits</h2>

        <p>Audit Ratio: <span id="audits-ratio"></span></p>
        <p>XP Given: <span id="audits-xpGiven"></span></p>
        <p>XP Received: <span id="audits-xpReceived"></span></p>
        <p>Bonus XP: <span id="audits-bonusXp"></span></p>

        <p id="audits-warning"></p>

        <h3>XP Given vs XP Received</h3>
        <!-- JavaScript measures the labels and scales both audit bars within this 600-by-100 coordinate system. -->
        <svg id="audits-chart" viewBox="0 0 600 100" role="img"
            aria-label="Comparison of XP given and XP received"></svg>
    </section>

    <button id="logout-button">Logout</button>

    <script src="src/main.js" type="module"></script>
</body>

</html>
